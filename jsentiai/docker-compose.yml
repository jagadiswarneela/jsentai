services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: jsentiai
      FRONTEND_ORIGIN: http://localhost:5173
    depends_on:
      - mongo
volumes:
  mongo-data:
